<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>离线织造排产台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 16px; margin: 18px 0 8px; }
    h2:first-child { margin-top: 0; }
    button { border: 0; border-radius: 8px; padding: 9px 12px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { background: #71675c; }
    button.danger { background: #9c3b2f; }
    button.small { padding: 5px 9px; font-size: 12px; border-radius: 6px; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    input[type="color"] { padding: 2px; height: 38px; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 290px 1fr 370px; gap: 16px; padding: 16px; align-items: start; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 640px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; position: relative; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 4px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 4px 0; font-size: 13px; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .muted { color: #8a7d70; font-size: 12px; }
    .ok { color: #355b38; font-weight: 700; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 800; margin-right: 4px; }
    .b-PENDING_REVIEW { background: #fbe3c8; color: #8a4b12; }
    .b-READY { background: #dde9d6; color: #355b38; }
    .b-WEAVING { background: #d8e6ee; color: #1f5f78; }
    .b-DONE { background: #e4ddd2; color: #5c5248; }
    .b-FROZEN { background: #f3d4d0; color: #a03a2e; }
    .b-risk { background: #f3d4d0; color: #a03a2e; }
    .b-norisk { background: #dde9d6; color: #355b38; }
    .b-review-done { background: #dde9d6; color: #355b38; }
    .b-review-todo { background: #f3d4d0; color: #a03a2e; }
    .vitem, .ocard { border: 1px solid #e1d5c5; border-radius: 8px; padding: 9px; margin-bottom: 8px; background: #fffdf8; }
    .vitem.sel { border-color: #8d3e37; box-shadow: 0 0 0 1px #8d3e37; }
    .vrow { display: flex; align-items: center; gap: 8px; }
    .vrow input[type="radio"] { width: auto; }
    .vmeta { font-size: 12px; color: #8a7d70; margin: 4px 0; }
    .ackline { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed #e1d5c5; }
    .ackline input { width: auto; }
    .ocard .ttl { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ocard .meta { font-size: 12px; color: #8a7d70; margin: 4px 0; display: grid; gap: 2px; }
    .ocard .acts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    #log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; max-height: 180px; overflow: auto; background: #211c17; color: #e8ddca; border-radius: 8px; padding: 10px; display: grid; gap: 3px; }
    .log-ERR { color: #f0a08f; } .log-OK { color: #a9d49a; } .log-SYS { color: #c9bde8; }
    .full { grid-column: 1 / -1; }
    .gate { border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 13px; }
    .gate.no { background: #f6e2de; border: 1px solid #d6a59d; }
    .gate.yes { background: #e6efdf; border: 1px solid #aac39c; }
    @media (max-width: 1100px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>离线织造排产台</h1>
      <div>纹样版本按网格与色线锁定 · 建单先过断线复核 · 一织机一未完工单 · 开工改纹样即冻结留档。</div>
    </div>
    <div class="toolbar" style="grid-template-columns:auto auto;">
      <button id="dupDemoBtn" class="secondary" title="用相同幂等键再次提交，演示 409 重复提交">演练：重复提交(409)</button>
      <button id="resetBtn" class="danger">清空演示数据</button>
    </div>
  </header>

  <main class="app">
    <!-- 左：草稿绘制 -->
    <aside class="panel">
      <h2>画布（草稿）</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn" style="width:100%;margin-top:8px;">新建网格</button>
      <p class="muted" style="margin:6px 0 0;">提示：织造中修改行列数会立即冻结在织旧单。</p>

      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <label>当前色线色号</label><input id="activeHex" type="color">
      <label>色线名称</label><input id="activeName" type="text">

      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>

      <h2>编辑</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>

      <h2>版本锁定</h2>
      <label>版本说明</label><input id="changeNote" type="text" placeholder="如：牡丹纹改丹红勾边">
      <button id="lockBtn" style="width:100%;margin-top:8px;">锁定为新版本（网格+色线快照）</button>
    </aside>

    <!-- 中：网格 + 版本档案 -->
    <section class="panel">
      <div class="grid" id="grid"></div>
      <p class="muted" style="text-align:center;">点击填色，按住拖动可连续填色。草稿自动离线保存。</p>
      <h2>纹样版本档案</h2>
      <div id="versions"></div>
    </section>

    <!-- 右：断线复核 + 建单 + 工单列表 -->
    <aside class="panel">
      <h2>断线复核（建单闸门）</h2>
      <div id="review"></div>

      <h2>创建织造单</h2>
      <div id="orderForm"></div>

      <h2>织造单列表</h2>
      <div id="orders"></div>
    </aside>

    <section class="panel full">
      <h2>操作日志（HTTP 语义 · 刷新后与列表一致）</h2>
      <div id="log"></div>
    </section>
  </main>

  <script src="js/review.js"></script>
  <script src="js/status.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
