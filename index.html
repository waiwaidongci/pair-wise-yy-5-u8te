<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>离线织造排产台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 16px; margin: 16px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 9px 12px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 290px 1fr 350px; gap: 16px; padding: 16px; align-items: start; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 680px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; padding: 0; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stats { display: grid; gap: 4px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 5px 0; font-size: 13px; }
    .dot { display: inline-block; width: 12px; height: 12px; border: 1px solid #c9bbab; vertical-align: -1px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .medium-warn { color: #9a6a1c; font-weight: 700; }
    .ok-flag { color: #2f6b39; font-weight: 800; }
    .hint { color: #8a7d70; font-size: 12px; }
    .ver-card { border: 1px solid #d9cdbc; border-radius: 8px; padding: 9px; margin-bottom: 8px; background: #fff; }
    .ver-card.current { border-color: #8d3e37; }
    .ver-card.archived { opacity: .75; }
    .mini-ver, .mini-order { display: grid; gap: 1px; margin: 6px 0; }
    .mini-ver span, .mini-order span { aspect-ratio: 1; border-radius: 1px; }
    .mini-order { max-width: 150px; }
    .risk-list { display: grid; gap: 5px; margin-top: 8px; }
    .risk-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; border-bottom: 1px dashed #e1d5c5; padding-bottom: 5px; }
    .risk-row button { padding: 4px 8px; font-size: 12px; }
    .tag { font-size: 11px; border-radius: 999px; padding: 2px 8px; font-weight: 800; }
    .tag.danger { background: #f6d9d4; color: #a03a2e; }
    .tag.warn { background: #f5e6c8; color: #8a5e12; }
    .tag.ok { background: #d8ecd9; color: #2f6b39; }
    .order-card { border: 1px solid #d9cdbc; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #fff; }
    .order-card.pending_review { border-left: 5px solid #c9821e; }
    .order-card.scheduled { border-left: 5px solid #1f5f78; }
    .order-card.weaving { border-left: 5px solid #2f6b39; }
    .order-card.frozen { border-left: 5px solid #71675c; background: #f1ece3; }
    .order-card.done { border-left: 5px solid #9ab2a0; opacity: .85; }
    .order-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .order-actions { margin-top: 8px; display: flex; gap: 8px; }
    .frozen-note { background: #e7e0d4; border-radius: 6px; padding: 7px 9px; font-size: 12px; margin: 6px 0; color: #4d443b; }
    .badge { font-size: 11px; border-radius: 999px; padding: 2px 9px; font-weight: 800; }
    .badge.pending_review { background: #f5e6c8; color: #8a5e12; }
    .badge.scheduled { background: #d7e6ee; color: #1f5f78; }
    .badge.weaving { background: #d8ecd9; color: #2f6b39; }
    .badge.frozen { background: #dcd5ca; color: #574e44; }
    .badge.done { background: #dde6df; color: #46604c; }
    .loom { border-radius: 6px; padding: 7px 9px; font-size: 13px; margin-bottom: 6px; }
    .loom.busy { background: #f6d9d4; }
    .loom.free { background: #e4ede5; }
    .reqline { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    #toast { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 20; max-width: 380px; }
    .toast { padding: 10px 13px; border-radius: 8px; font-size: 13px; font-weight: 700; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
    .toast.ok { background: #2f6b39; }
    .toast.err { background: #a03a2e; }
    .toast.info { background: #71675c; }
    @media (max-width: 1100px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>离线织造排产台</h1>
      <div class="hint">纹样版本按网格与色线锁定 · 创建织造单前完成断线复核 · 一机一单 · 数据离线保存在本机，刷新不丢失</div>
    </div>
    <div class="toolbar"><button id="exportBtn" class="secondary">导出排产JSON</button></div>
  </header>
  <main class="app">
    <!-- 左：纹样设计（草稿） -->
    <aside class="panel">
      <h2>画布（草稿）</h2>
      <div class="toolbar">
        <div><label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36"></div>
        <div><label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32"></div>
      </div>
      <div class="toolbar" style="margin-top:8px">
        <button id="applySizeBtn" class="secondary">调整行列</button>
        <button id="clearBtn" class="secondary">清空草稿</button>
      </div>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <label>修改选中色线颜色（锁定新版本后生效）</label>
      <input id="colorPick" type="color">
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
      <h2>草稿操作</h2>
      <div class="toolbar">
        <button id="saveDraftBtn" class="secondary">保存草稿</button>
        <button id="lockBtn">锁定为新版本</button>
      </div>
      <h2>用色统计（草稿）</h2>
      <div class="stats" id="stats"></div>
      <h2>草稿断线提示</h2>
      <div id="draftRisk"></div>
    </aside>

    <!-- 中：网格 + 版本留档 -->
    <section class="panel">
      <div class="grid" id="grid"></div>
      <p class="hint" style="text-align:center">点击填色，按住拖动连续填色。草稿不会改动任何已锁定版本与织造单。</p>
      <h2>纹样版本（网格 + 色线锁定留档）</h2>
      <div id="versions"></div>
    </section>

    <!-- 右：复核 + 排产 -->
    <aside class="panel">
      <h2>断线复核（当前版本）</h2>
      <div id="reviewPanel"></div>
      <h2>创建织造单</h2>
      <label>织机编号</label><input id="loomInput" placeholder="如 3#">
      <label>织工</label><input id="workerName" placeholder="织工姓名">
      <label>请求号（相同请求号重复提交 → 409）</label>
      <div class="reqline"><input id="reqId" readonly><button id="newReqBtn" class="secondary" type="button">换号</button></div>
      <div style="margin-top:8px"><button id="submitOrder" style="width:100%">创建织造单（同时自检并发）</button></div>
      <p class="hint">提交时会并发发送两个相同请求，仅一个落库，另一个返回 409。</p>
      <h2>织机占用</h2>
      <div id="looms"></div>
      <h2>织造单列表</h2>
      <div id="orders"></div>
    </aside>
  </main>
  <div id="toast"></div>

  <script src="js/store.js"></script>
  <script src="js/review.js"></script>
  <script src="js/status.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
